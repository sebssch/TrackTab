# ╔══════════════════════════════════════════════════════════════╗
# ║  TrackTab — Konfiguration                                     ║
# ╚══════════════════════════════════════════════════════════════╝

version: "1.0"

# --- Bibliothek ---
library_paths:
  - "~/Music/Music"

extensions: [".mp3", ".aif", ".aiff", ".m4a", ".aac", ".flac", ".wav"]

exclude_dirs:                  # Verzeichnisnamen, die uebersprungen werden
  - ".git"
  - "Ableton"
  - "Logic"
  - "Audio Music Apps"
  - "Samples"

min_duration_s: 30.0           # Kuerzere Dateien (Jingles, Effekte) ignorieren

update_ignore_version: ""      # Vom Update-Hinweis beim Start gesetzt ("Diese Version ignorieren"), leer = nichts ignoriert

cover_auto_fill: true          # Beim Scan Cover aus Music.app uebernehmen (nur neue Dateien + DB-Cache-Abgleich, nie beim Import)

external_browser: "/Applications/Safari.app"   # Browser fuer die Web-UI, leer = Systemstandard

# Namensmuster fuer "Dateien automatisch umbenennen" in der Einzelpruefung.
# Platzhalter: {artist} {title} {album} {albumartist} {composer} {genre}
#              {bpm} {key} {bitrate} {year} {samplerate} {track}
# "_" trennt die Kategorien, "-" Woerter innerhalb einer Kategorie. Ein
# Platzhalter ohne Wert laesst seine Kategorie weg -- {bitrate} bleibt bei
# FLAC/WAV/AIFF/ALAC leer. Nur Dateien ausserhalb der library_paths.
rename_pattern: "{artist}_{title}_{bpm}_{key}_{bitrate}_{year}"

# --- Titel-Bereinigung (Auffaelligkeiten) ---
# Was "Auffaelligkeiten" in Titel/Interpret/Album/Kommentar sucht.
# tagclean_*: sicher, "Auffaelligkeiten beheben" schreibt die Korrektur.
# tagwatch_*: nur Hinweis, bereinigter Wert als Vorschlag im Tags-Dialog.
# Nach einer Aenderung "Auffaelligkeiten neu pruefen" (recheck-tags) laufen lassen.
tagclean_web: true       # Webadressen, "[Promo]", "Downloaded from ..."
tagclean_video: true     # "(Official Video)", "[HD]", "(Free Download)"
tagclean_spaces: true    # Unterstriche und Doppelleerzeichen
tagwatch_trackno: true   # "01 - Titel", "Interpret - Titel" im Titel
tagwatch_remix: true     # "Titel - X Remix" / "[X Remix]" -> "(X Remix)"
tagwatch_feat: true      # ft./featuring/feat -> feat.
tagwatch_case: false     # Titel/Album komplett GROSS oder klein
tagwatch_quotes: false   # typografische Apostrophe/Anfuehrungszeichen
# Listen (Gross/Klein egal) und Ziel-Schreibweisen -- Vorgaben stehen in config.py:
# tagclean_web_words / tagclean_web_tlds       Promo-Woerter in Klammern, Domain-Endungen
# tagclean_video_remove                        Woerter, die eine Klammer als Video-Zusatz kennzeichnen
# tagclean_underscore_single: space | hyphen    "_" -> Leerzeichen bzw. "-"
# tagclean_underscore_double: dash | endash | pipe | space   "__" -> " - ", " – ", " | " oder " "
# tagwatch_remix_words, tagwatch_remix_style: round | square | dash
# tagwatch_feat_word: feat | ft | featuring,  tagwatch_feat_bracket: none | round | square
# tagwatch_case_style: title | sentence | upper | lower
# tagwatch_quotes_style: straight | typographic

# --- Dekodierung ---
max_analysis_s: 420            # Nur die ersten N Sekunden analysieren (DJ-Sets kappen)
skip_head_pct: 0.03            # Anfang aussparen (Intro/Stille)
skip_tail_pct: 0.03            # Ende aussparen (Fade-Out)

# --- Spektralanalyse ---
fft_size: 8192                 # ~5.4 Hz Aufloesung bei 44.1 kHz
block_percentile: 95           # Robustes Peak-Hold ueber alle Bloecke (statt Mittelwert)
gate_rms_percentile: 55        # Nur die lauteren Bloecke auswerten ...
gate_abs_dbfs: -45.0           # ... und nur solche ueber diesem Absolutpegel
min_gated_blocks: 8            # Weniger gueltige Bloecke -> kein Urteil

ref_band_hz: [1000, 6000]      # Referenzband fuer den Mittenpegel
noise_band_rel: 0.97           # Rauschband = oberste 3 % bis Nyquist (nur Anzeige)
smooth_hz: 200.0               # Glaettungsbreite des Spektrums
search_floor_hz: 9000.0        # Unterhalb wird keine Kante mehr gesucht

# --- Kantendetektion ---
cliff_span_hz: 1000.0          # Vergleichsbreite ober- und unterhalb der Kante
cliff_min_db: 15.0             # Darunter gilt: kein Tiefpass vorhanden
steep_brickwall_db: 25.0       # Ab hier ist die Kante eindeutig ein Encoder-Tiefpass

# Plateau-Pruefung: Ueber einem Encoder-Tiefpass bleibt das Spektrum bis ganz
# oben leise. Eine Kante zaehlt nur, wenn das 90. Perzentil des GESAMTEN Bandes
# darueber (bis plateau_ceiling_hz) um mindestens plateau_min_ratio x Kanten-
# hoehe unter dem Pegel darunter liegt. Sonst ist es eine Luecke im Spektrum
# mit Inhalt darueber -- an echtem Material: 320er ohne LAME-Kopf mit Loch bei
# 19,2-20,2 kHz und vollem Inhalt bis 22 kHz, vorher faelschlich FAKE.
# Echte Encoder-Kanten liegen bei ~0,9-1,1, die Luecken bei ~0-0,6.
plateau_min_ratio: 0.8
plateau_ceiling_hz: 22000.0

# Kantensuche je Zeitabschnitt. Ein Encoder-Tiefpass steht in jedem Abschnitt;
# der Anteil der Abschnitte mit eigener Kante fliesst in die Konfidenz ein.
# Liegen die Kanten in Gruppen an verschiedenen Stellen, die verschiedenen
# Bitrate-Klassen entsprechen, ist das Stueck meist aus mehreren Quellen
# zusammengesetzt (Edit/Mashup/Bootleg) -- das wird als Hinweis genannt.
edge_segment_s: 20.0           # Laenge eines Abschnitts
edge_min_segments: 4           # Weniger Abschnitte -> keine Aussage
edge_presence_high: 0.8        # Kante in mindestens diesem Anteil -> Konfidenz hoch
edge_presence_low: 0.5         # Kante in weniger als diesem Anteil -> Konfidenz runter
edge_cluster_hz: 300.0         # Kanten naeher beieinander gelten als eine Gruppe
edge_mixed_min_hz: 1000.0      # Mindestabstand der Gruppen fuer den Hinweis "mehrere Quellen"

# --- Klassifikation: gemessener Cutoff (kHz) -> Bitrate-Klasse ---
# Gelesen als "ab diesem Cutoff gilt die Klasse". Eine Leiter je Codec, weil
# jeder Encoder bei gleicher Bitrate einen anderen Tiefpass setzt.
#
# mp3: Die Grenzen stammen aus einer Messung an dieser Bibliothek: vier
# verlustfreie Tracks wurden mit LAME auf jede Stufe kodiert und der
# Tiefpass gemessen. Ergebnis (Streuung ueber alle vier jeweils unter
# 0,05 kHz):
#     128 → 16.76 · 160 → 17.46 · 192 → 18.84
#     224 → 19.52 · 256 → 19.53 · 320 → 20.21 kHz
# Die Grenzen liegen mittig zwischen diesen Werten. 224 und 256 kbps benutzen
# denselben Tiefpass und sind spektral nicht unterscheidbar.
# Nachmessen jederzeit mit: ./run.command calibrate
#
# aac: gemessen an Apples Encoder (afconvert = Music.app, wie aac_at in
# media.encode_aac()), 23 verlustfreie Quellen, CBR und VBR, 44,1 und 48 kHz
# (2026-11-07). Tiefpass je Stufe (min-max):
#     96 → 15.67-15.71 · 128 → 17.54-18.73 · 160 → 18.37-19.15
#    192 → 19.39-19.61 · 256 → keine harte Kante bei 44,1 kHz (Inhalt bis
#    ~22 kHz), 21.84-21.89 bei 48 kHz, ~20.1 hinter einer LAME-320-Quelle
# Apple setzt den Tiefpass je nach Material verschieden (128 kbps streut ueber
# 1,2 kHz), deshalb keine 160er-Klasse: 128 und 160 ueberlappen sich. Eine
# Zweitkodierung auf 256 kbps laesst die Kante der ersten Stufe unveraendert
# stehen (Abweichung < 0,05 kHz) -- solange ohne Clipping kodiert wurde,
# siehe media.resolved_aac_encoder().
cutoff_classes:
  mp3:
    - {min_khz: 19.85, kbps: 320}
    - {min_khz: 19.20, kbps: 256}
    - {min_khz: 17.80, kbps: 192}
    - {min_khz: 15.50, kbps: 128}
    - {min_khz: 0.0,   kbps: 64}
  aac:
    - {min_khz: 19.80, kbps: 256}
    - {min_khz: 19.25, kbps: 192}
    - {min_khz: 16.60, kbps: 128}
    - {min_khz: 0.0,   kbps: 96}

# Verdikt: Wie viele Klassen darf die Messung unter der Deklaration liegen?
# Gilt fuer verlustbehaftete Formate (MP3, AAC).
verdict_suspect_steps: 1       # 1 Klasse darunter -> VERDAECHTIG
verdict_fake_steps: 2          # 2+ Klassen darunter -> FAKE

# LAME-Header: Abweichung zwischen eingetragenem und gemessenem Lowpass
lame_lowpass_tolerance_khz: 1.0

# --- Verlustfreie Formate (ALAC/FLAC/WAV/AIFF) ---
# Keine deklarierte Bitrate vorhanden, deshalb kein Bitratenvergleich:
# Verdikt allein darueber, ob eine harte Encoder-Kante existiert und wie
# tief sie liegt. Ein echtes bandbegrenztes Master rollt weich aus statt
# hart abzuschneiden und faellt damit nicht unter diese Schwellen.
lossless_suspect_khz: 19.0     # Kante darunter (mit ausreichender Flankenhoehe) -> VERDAECHTIG
lossless_fake_khz: 17.5        # Kante darunter (mit ausreichender Flankenhoehe) -> FAKE

# Eigene (niedrigere) Flankenhoehe statt steep_brickwall_db: 16-Bit-PCM
# quantisiert nahezu stille Bloecke oberhalb des Cutoffs grob, was den
# messbaren Rauschboden dort anhebt und die Flanke gegenueber einer direkt
# dekodierten MP3 verflacht. An echtem Material (128kbps-MP3 nach FLAC/WAV
# verpackt) gemessen: ~13-16 dB statt >50 dB bei MP3 selbst.
lossless_min_steepness_db: 10.0

# Steht eine Kante zwar ueber lossless_suspect_khz (also kein Verdikt), aber
# unter diesem Wert und in fast allen Abschnitten, ist sie ein Encoder-Tiefpass
# und kein Anti-Aliasing-Filter des Masters: Hinweis "vermutlich aus einer
# ~320 kbps Quelle exportiert". An echtem Material: AIFF-Mashups mit Kanten bei
# 19,7-20,5 kHz (LAME 320 = 20,2 kHz). Aendert das Verdikt nicht.
lossless_source_max_khz: 21.0

# --- Lautheit (EBU R128 / ITU-R BS.1770 ueber ffmpeg 'loudnorm') ---
# Reiner Hinweis, kein Verdikt: anders als der Encoder-Tiefpass hat Lautheit
# keine "richtige" Zielgroesse, sie haengt von Genre und Erscheinungsjahr ab
# (Loudness War, sich wandelnde Mastering-Konventionen). Die Referenzwerte
# spannen ein DJ/Club-Band auf (typisch fuer heutige Club-Masters), keine
# Qualitaetsgrenze -- ein leiser gemastertes altes Stueck ist nicht "falsch".
loudness_ref_low_lufs: -9.0    # Integrated Loudness darunter -> "leiser als Club-Standard"
loudness_ref_high_lufs: -6.0   # Integrated Loudness darueber -> "lauter als Club-Standard"

# Einzige Ausnahme: Intersample-Clipping ist immer ein technischer Fehler,
# unabhaengig von Genre oder Epoche.
loudness_clip_dbtp: -1.0       # True Peak darueber -> Clip-Warnung

# --- Rekordbox-Import ---
rekordbox_quality_check: true  # Cutoff-Pruefung beim Hinzufuegen zu einer Rekordbox-Playlist
rekordbox_min_cutoff_khz: 19.0 # Tracks darunter (oder ohne Messwert) loesen eine Warnung aus
# Waveform-Farbe in Bearbeiten und Player: standard (grau), rgb oder 3band. Die
# Darstellung erzeugt dort immer TrackTab selbst.
waveform_style: "rgb"
# Wellenform der DJ-Ansicht: fallback (Rekordbox, sonst TrackTab) oder tracktab.
dj_waveform_source: "fallback"
# Farbe dort, unabhaengig von Bearbeiten und Player: standard, rgb oder 3band.
dj_waveform_style: "rgb"
# Flaeche dort: dark, light oder ui (folgt dem Design).
dj_waveform_surface: "dark"
# Klang des Metronoms im DJ-Editor: beep, click, wood, rim, cowbell oder hihat.
dj_metronome_sound: "beep"
# Stimmungen + eigene Tags beim Playlist-Push als Rekordbox-"My Tag" setzen.
# Die Spalte muss in Rekordbox existieren (vier feste Spalten, eine davon
# umbenennen) -- sie gehoert dann TrackTab: nicht mehr zutreffende Tags darin
# werden entfernt, andere Spalten bleiben unberuehrt.
rekordbox_mytags: false
rekordbox_mytag_category: "TrackTab"

# --- Ausgabe ---
# --- Darstellung (Web-UI) ---
# Haelt die Filterleiste (Listen, Status, Suche, Sammelaktionen) beim
# Scrollen am oberen Fensterrand fest. Aus, weil die Leiste je nach
# Fensterbreite auf mehrere Zeilen umbricht und dann viel Hoehe kostet.
pin_filter_bar: false

# Laedt beim Erreichen des Listenendes automatisch weitere Treffer nach,
# statt "weitere N laden" von Hand anzuklicken.
infinite_scroll: false

# Schriftgroesse der gesamten Oberflaeche: klein, mittel oder gross.
font_size: "mittel"

# Farbschema: auto (folgt dem System), light oder dark.
theme: "auto"

# Schreibweise der Tonart: camelot (8A), openkey (1m) oder notes (Am).
# Wirkt auf Anzeige, geschriebene Datei-Tags und den Rekordbox-Uebertrag.
key_notation: "camelot"

# --- BPM-/Tonart-Analyse (libsonare) ---
# Die Tonart wird in Feld und Kommentar in der Schreibweise von key_notation
# geschrieben. Neue Einzelpruefungs-Dateien automatisch analysieren:
bpmkey_auto_drops: true
# Welche Teilanalysen laufen (Knoepfe, Scan, Einzelpruefungen):
# BPM, Tonart, Genre-Vorschlaege, Stimmung & Energie.
measure_bpm: true
measure_key: true
measure_genre: true
measure_mood: true
# Dateien laenger als diese Minuten werden nicht analysiert (DJ-Mixe) -- gilt
# auch fuer die Genre-/Stimmungs-Analyse.
bpmkey_max_minutes: 10
# Tonart ins Tonart-Feld schreiben: yes (ueberschreibt) | if_empty (nur wenn
# dort noch keine Tonart steht) | no.
bpmkey_write_key: "yes"
# Dasselbe fuer die BPM im BPM-Feld.
bpmkey_write_bpm: "yes"
# Gemeinsamer Kommentar-Eintrag von BPM-/Tonart- und Genre-/Stimmungs-Analyse:
# none | key ("10A") | key_bpm ("10A - 126") | key_bpm_energy ("10A - 126 - E7")
# | key_energy ("10A - E7") | energy ("E7").
bpmkey_comment_content: "none"
# Bei vorhandenem Kommentar: if_empty | overwrite | prepend (voranstellen) |
# append (anhaengen) | complete (Fehlendes ergaenzen: vorhandene Werte bleiben,
# nur fehlende Teile kommen dazu, "8A - 128" -> "8A - 128 - E7").
bpmkey_comment_existing: "overwrite"

# Genre-Vorschlaege, Stimmung und Energie (app/genremood.py, Essentia-Modelle
# der MTG, Lizenz CC BY-NC-SA 4.0). Ergebnisse stehen immer in der Datenbank.
# Laengenlimit und Kommentar teilt sie mit der BPM-/Tonart-Analyse oben.
# Neue Einzelpruefungs-Dateien automatisch analysieren:
genremood_auto_drops: false
# Genre-Vorschlaege unter dieser Wahrscheinlichkeit (Prozent) ausblenden.
genremood_min_percent: 5
# Beatgrid der Phrasen-Analyse: auto (Flex nur bei Tempowechsel) | normal | flex.
phrase_grid_mode: auto
# Woher Beatgrid und Phrasen kommen: fallback (Rekordbox, sonst TrackTab) |
# rekordbox | tracktab.
beatgrid_source: fallback

# Auto Cue (app/autocue/): setzt Cues aus Beatgrid, Phrasen und Klang.
# Automatisch gemessene Phrasen als Hinweis nutzen (nie als feste Position).
# Von Hand bearbeitete Phrasen gelten immer: die Cues rasten auf ihren Grenzen ein.
autocue_use_phrases: true
# Memory Cues: fest hoechstens 10 (Rekordbox), keine Einstellung.

# Konfidenz je Rolle als Stufe: very_safe | safe | normal | risky | very_risky.
# Darunter wird die Rolle nicht gesetzt. "normal" = an den Modellen kalibrierter
# Wert je Rolle (Drop 2 0,18, Build vor Drop 2 0,4, uebrige 0,3, default 0,25;
# autocue/slots.py: CONFIDENCE_CALIBRATED). default gilt fuer eigene Regeln
# ("8 Takte vor Drop 2") und alles Uebrige.
autocue_conf_default: normal
autocue_conf_intro_1: normal
autocue_conf_break1: normal
autocue_conf_drop1: normal
autocue_conf_break2: normal
autocue_conf_setup: normal
autocue_conf_drop2: normal
autocue_conf_outro_start: normal
# Die Slot-Belegung (autocue_slots) steht in config.defaults() bzw.
# autocue/slots.py und wird nur ueber die Einstellungsseite geaendert.
# Ebenso das geltende Modell (autocue_model): die id eines eigenen Modells der
# Bibliothek (Einstellungen -> Auto Cue -> Modelle). Ein mitgeliefertes Modell
# gibt es nicht -- jede Installation trainiert nach ihren eigenen Cues.
# Stimmungen als Mood-Tag schreiben (TXXX:MOOD bzw. MOOD): no | tag.
genremood_write_mood: "no"

# Stem-Trennung (Acapella / Instrumental, app/stems.py). Der Titel der neuen
# Datei bekommt den Zusatz angehaengt, das Genre wird ersetzt; alle anderen
# Tags und das Cover bleiben die des Haupttracks. Den Dateinamen bestimmt
# rename_pattern. Dateien ueber stems_max_minutes werden nicht getrennt.
stems_title_acapella: "(Acapella)"
stems_title_instrumental: "(Instrumental)"
stems_genre_acapella: "Acapella"
stems_genre_instrumental: "Instrumental"
stems_max_minutes: 15
# Stem in Rekordbox anlegen: off | no_cues | cues. Nur wenn der Haupttrack dort
# steht und beide dasselbe Format haben (MP3 -> MP3, verlustfrei -> AIFF); ein
# AAC-Haupttrack ergibt einen MP3-Stem, dessen Beatgrid nicht passen wuerde.
# Beatgrid immer vom Haupttrack, Hot/Memory Cues nur bei "cues".
stems_rekordbox: "cues"

# Akzentfarbe der Oberflaeche (aktive Knoepfe, Player-Fortschritt, ...).
# Eine von: blue, cyan, teal, indigo, violet, purple, fuchsia, pink.
accent_color: "blue"

# Toleranz fuer Tippfehler in der Suche (0 = aus, nur exakte Treffer;
# 1 = sehr tolerant). Wirkt wortweise, auch auf /Parameter-Werte.
search_typo_tolerance: 0.8

# Mindestanzahl getippter Zeichen, bevor die Werte-Autovervollstaendigung eines
# /Parameters Vorschlaege zeigt. Die Vorschlagsliste der Parameternamen selbst
# ("/al" -> "/Album") greift davon unabhaengig immer ab dem ersten Zeichen,
# ebenso die kurze feste Werteliste von "/Status".
search_autocomplete_min_chars: 3

# Immer zusaetzlich zur eingegebenen Suche angewendete /Parameter-Ausdruecke
# (gleiche Syntax wie das Suchfeld), ein Eintrag pro Zeile. Leer = keine
# Standardfilter.
default_search_filters: []

db_path: "data/quality.db"
report_path: "data/tracktab.html"
csv_path: "data/tracktab.csv"
m3u_path: "data/verdaechtig.m3u8"
stats_path: "data/stats.json"  # Jahres-/Monats-Statistik, lazy gebaut (app/stats.py)
spectrum_points: 160           # Aufloesung der Miniatur-Spektren im HTML-Report

# --- Backup ---
# Hoechstens ein automatisches Backup pro Kalendertag (geprueft beim Start
# jedes CLI-Befehls), die aeltesten fliegen ueber backup_keep hinaus raus.
# Manuelle Backups (Export/Wiederherstellung ueber die Oberflaeche oder
# ./run.command backup) zaehlen nicht mit.
# backup_keep_days: zusaetzlich bleibt je das letzte Backup der juengsten N
# Tage, an denen es eines gibt (0 = aus). Schuetzt aeltere Staende davor, von
# vielen Sitzungen am selben Tag verdraengt zu werden.
backup_path: "backup"
backup_keep: 10
backup_keep_days: 7

# --- Performance ---
workers: 0                     # parallel gemessene Dateien beim Scan; 0 = alle CPU-Kerne minus 1
