# Auto-Cue-Training im Entwicklungsordner (./run.command autocue-train).
# Kopieren nach autocue-train.yaml (wird nicht eingecheckt) und anpassen.

# Datenordner der TrackTab-Instanz, deren Tracks und Hand-Cues gelernt werden.
# Ein Ordner, eine TrackTab.app (dann gilt deren Datenordner) oder kurz:
# dev (dieser Ordner), installed (installierte App), build.
instance: installed

# TrackTab-Playlisten dieser Instanz, per Name (bei gleichen Namen "Ordner/Name").
# Nur normale Playlisten. Die beiden duerfen keinen Track gemeinsam haben.
training_playlist: "Training"     # aus diesen Tracks wird gelernt (je mehr, desto besser)
check_playlist: "Prüfliste"       # an diesen Tracks wird gemessen, nie gelernt

# Name des neuen Modells (Liste unter Einstellungen -> Auto Cue -> Modelle).
name: ""

# Was gelernt wird, kommt aus der Slot-Belegung der Instanz (Einstellungen ->
# Auto Cue), wie in der App. Drop 2 und Break 1 muessen dort auf einem Hot Cue
# liegen. Nur zum Ausprobieren laesst sich hier eine feste Hot-Cue-Zuordnung
# setzen (A..H); Pflicht drop2 + break1, optional drop1, break2, outro_start --
# die uebrigen lernen dann aus den Memory Cues.
# label_slots: {drop2: C, break1: A}

# Nach der Rueckfrage kommt das neue Modell in die Modellbibliothek der Instanz
# und wird dort ausgewaehlt (ein mitgeliefertes Modell gibt es nicht). Eine ZIP
# zum Laden in der App (Einstellungen -> Auto Cue -> Modell importieren) entsteht
# immer, mit Protokoll und Modell in autocue-training/runs/<zeit>/ in diesem
# Ordner (gitignored).

# Faltungen der Kreuzvalidierung und Prozesse (0 = Kerne minus 2).
folds: 5
workers: 0
